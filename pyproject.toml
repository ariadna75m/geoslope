[project]
name = "geoslope-review"
version = "0.7.5"
requires-python = ">=3.11"
description = "Aplicación offline de revisión de anomalías estadísticas"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gsreview", "gsreview.*"]
exclude = ["tests", "tests.*"]
