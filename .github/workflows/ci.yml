name: Geoslope CI Pipeline

on:
  push:
    branches: [ "main", "project-structure" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 pyyaml
          # Instalar el paquete si existe pyproject.toml en la raiz o en la subcarpeta
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -d geoslope_review ] && [ -f geoslope_review/pyproject.toml ]; then pip install -e ./geoslope_review; fi

      - name: Revision de sintaxis con Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Ejecutar pruebas unitarias (Pytest)
        run: |
          # Si los tests estan dentro de geoslope_review, corre pytest ahi
          if [ -d "geoslope_review/tests" ]; then
            cd geoslope_review && pytest
          else
            pytest
          fi
