name: Geoslope CI Pipeline

on:
  push:
    branches: [ "main", "project-structure" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Revision de sintaxis con Flake8
        run: |
          # Detiene la ejecucion si hay errores de sintaxis en Python
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Ejecutar pruebas unitarias (Pytest)
        run: |
          pytest
